<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Bitzlatoview</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0B0F1A;
            color: #F5F7FA;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .card {
            max-width: 420px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #F5B301, #d99a00);
            color: #0B0F1A;
            font-weight: 800;
            font-size: 28px;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #9AA3B2; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
        button {
            appearance: none;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            background: linear-gradient(135deg, #F5B301, #d99a00);
            color: #0B0F1A;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">B</div>
        <h1>You're offline</h1>
        <p>Bitzlatoview needs an internet connection to show live balances and market data. Reconnect and try again — nothing was lost, your account is exactly as you left it.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
